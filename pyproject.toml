[project]
name = "modelCraft"
version = "0.3.0"
description = "Python utilities for modelCraft: dataset preparation, training monitoring with wandb"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "modelCraft Team" }
]
keywords = ["language-model", "diffusion", "lut", "snn", "wandb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "dill>=0.3.6,<0.3.8",
    "datasets>=2.14.0",
    "huggingface-hub>=0.20.0",
    "tokenizers>=0.15.0",
    "wandb>=0.16.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "toml>=0.10.0",
    "torch>=2.9.1",
    "pytorch-lightning>=2.6.0",
    "jsonargparse[signatures]>=4.27.0",
    "einops>=0.8.1",
    "triton",
    "lightning>=2.6.0",
    "transformers>=5.2.0",
    "socksio>=1.0.0",
    "liger-kernel>=0.7.0",
    "xformers>=0.0.35",
    "altair>=6.0.0",
    "datatrove>=0.8.0",
    "fsspec>=2025.10.0",
    "jinja2>=3.1.6",
    "lm-eval>=0.4.11",
    "luigi>=3.7.3",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "orjson>=3.11.7",
    "pydantic>=2.12.5",
    "nvidia-ml-py>=13.0.0",
    "s3fs>=2025.10.0",
    "scipy>=1.15.3",
    "sentencepiece>=0.2.1",
    "submitit>=1.5.4",
    "tiktoken>=0.12.0",
    "typer>=0.24.1",
    "viztracer>=1.1.1",
    "hf-cli>=0.1",
    "pyarrow>=23.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
modelCraft-py = "modelCraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelCraft"]

[tool.ruff]
line-length = 150
target-version = "py310"
# Ignore /ref dir for linting, as it contains generated code
exclude = ["ref/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "accelerate>=1.12.0",
]
